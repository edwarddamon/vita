name: VITA CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择需要compile、build和push的分支：'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - develop*
          - release*
      service:
        description: 'Microservice to build and deploy'
        required: true
        default: 'user-service'
        type: choice
        options:
          - vita-gateway
          - vita-api
          - vita-auth-center
          - vita-message

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TCR_REGISTRY: ${{ secrets.URL_PREFIX }}
      TCR_REPO: "vita_namespace"
      TCR_IMAGE: ${{ env.TCR_REGISTRY }}/${{ TCR_REPO }}/${{ github.event.inputs.service }}:${{ github.sha }}

    steps:
    # 1. 检出代码（使用指定分支）
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    # 2. 设置 JDK 8
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    # 3. 缓存 Maven 依赖（针对指定微服务）
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('microservices/${{ github.event.inputs.service }}/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    # 4. 构建指定微服务
    - name: Build selected microservice
      run: mvn -B clean package -DskipTests -f microservices/${{ github.event.inputs.service }}/pom.xml

    # 5. 构建 Docker 镜像（针对指定微服务）
    - name: Build Docker image for selected service
      run: |
        docker build -t ${{ env.TCR_IMAGE }} -f microservices/${{ github.event.inputs.service }}/Dockerfile .
        echo "${{ secrets.TCR_PASSWORD }}" | docker login ${{ env.TCR_REGISTRY }} -u ${{ secrets.TCR_USERNAME }} --password-stdin

    # 6. 推送镜像到腾讯云
    - name: Push Docker image to TCR
      run: |
        docker tag ${{ env.TCR_IMAGE }} ${{ env.TCR_IMAGE }}
        docker push ${{ env.TCR_IMAGE }}
