services:
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: nacos_2.4.0
    ports:
      - 8828:8848
      - 9828:9848
      - 9829:9849
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      NACOS_AUTH_ENABLE: true # 开启权限控制
      NACOS_AUTH_TOKEN: 'changeme_nacos_auth_token=' # 自定义token
      NACOS_AUTH_IDENTITY_KEY: identityKey # 自定义标识
      NACOS_AUTH_IDENTITY_VALUE: identityValue # 自定义标识
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: 127.0.0.1
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: 'nacos'
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC
    volumes:
      - /opt/nacos/logs/:/home/nacos/logs

  redis_5.0:
    image: redis:5.0
    container_name: redis_5.0
    restart: on-failure
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /opt/redis/data:/data
      - /opt/redis/conf/redis.conf:/etc/redis/redis.conf
    ports:
      - "6399:6379"
    command: /bin/sh -c "redis-server /etc/redis/redis.conf --requirepass changeme_redis"
    privileged: true # 使用该参数，container内的root拥有真正的root权限。否则，container内的root只是外部的一个普通用户权限