# 应用服务编排。镜像名与数据目录通过 .env 配置，参考 .env.example.properties。
services:
  vita-gateway:
    image: ${VITA_GATEWAY_IMAGE:-vita-gateway:latest}
    container_name: vita-gateway
    restart: always
    ports:
      - "${VITA_GATEWAY_PORT:-8888}:8888"
    environment:
      - ACTIVE_PROFILE=${ACTIVE_PROFILE:-test}
    volumes:
      - ${VITA_DATA_DIR:-./logs}/vita-gateway/logs:/opt/vita/logs/
      - ${VITA_DATA_DIR:-./logs}/vita-gateway/dumps:/opt/vita/dumps/
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"

  vita-auth-center:
    image: ${VITA_AUTH_CENTER_IMAGE:-vita-auth-center:latest}
    container_name: vita-auth-center
    restart: always
    ports:
      - "${VITA_AUTH_CENTER_PORT:-8033}:8033"
    environment:
      - ACTIVE_PROFILE=${ACTIVE_PROFILE:-demo}
    volumes:
      - ${VITA_DATA_DIR:-./logs}/vita-auth-center/logs:/opt/vita/logs/
      - ${VITA_DATA_DIR:-./logs}/vita-auth-center/dumps:/opt/vita/dumps/
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"

  vita-api:
    image: ${VITA_API_IMAGE:-vita-api:latest}
    container_name: vita-api
    restart: always
    ports:
      - "${VITA_API_PORT:-8023}:8023"
    environment:
      - ACTIVE_PROFILE=${ACTIVE_PROFILE:-demo}
    volumes:
      - ${VITA_DATA_DIR:-./logs}/vita-api/logs:/opt/vita/vita-api/logs/
      - ${VITA_DATA_DIR:-./logs}/vita-api/dumps:/opt/vita/vita-api/dumps/
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"

  vita-message:
    image: ${VITA_MESSAGE_IMAGE:-vita-message:latest}
    container_name: vita-message
    restart: always
    ports:
      - "${VITA_MESSAGE_PORT:-8043}:8043"
    environment:
      - ACTIVE_PROFILE=${ACTIVE_PROFILE:-demo}
    volumes:
      - ${VITA_DATA_DIR:-./logs}/vita-message/logs:/opt/vita/logs/
      - ${VITA_DATA_DIR:-./logs}/vita-message/dumps:/opt/vita/dumps/
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"

  vita-im:
    image: ${VITA_IM_IMAGE:-vita-im:latest}
    container_name: vita-im
    restart: always
    ports:
      - "${VITA_IM_PORT:-8053}:8053"
    environment:
      - ACTIVE_PROFILE=${ACTIVE_PROFILE:-demo}
    volumes:
      - ${VITA_DATA_DIR:-./logs}/vita-im/logs:/opt/vita/logs/
      - ${VITA_DATA_DIR:-./logs}/vita-im/dumps:/opt/vita/dumps/
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"
