services:
  vita-gateway:
    image: xxxxx/vita-gateway:1.0.0
    container_name: vita-gateway
    restart: always
    ports:
      - "8888:8888"
    environment:
#      - JAVA_OPTS=-Xms256m -Xmx512m
      - ACTIVE_PROFILE=test
    volumes:
      - /opt/vita/vita-gateway/logs:/opt/vita/logs/
      - /opt/vita/vita-gateway/dumps:/opt/vita/dumps/
    logging:
      driver: "json-file" # 默认的文件日志驱动
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"

  vita-auth-center:
    image: xxxxx/vita-auth-center:1.0.0
    container_name: vita-auth-center
    restart: always
    ports:
      - "8033:8033"
    environment:
#      - JAVA_OPTS=-Xms256m -Xmx512m
      - ACTIVE_PROFILE=test
    volumes:
      - /opt/vita/vita-auth-center/logs:/opt/vita/logs/
      - /opt/vita/vita-auth-center/dumps:/opt/vita/dumps/
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"

  vita-api:
    image: vita-api:dev-2.0.0
    container_name: vita-api
    restart: always
    ports:
      - "8023:8023"
    environment:
#      - JAVA_OPTS=-Xms256m -Xmx512m
      - ACTIVE_PROFILE=test
    volumes:
      - /opt/vita/vita-api/logs:/opt/vita/vita-api/logs/
      - /opt/vita/vita-api/dumps:/opt/vita/vita-api/dumps/
    deploy: # Swarm 专属配置（Compose 下会忽略）
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"

  vita-message:
    image: xxxxx/vita-message:1.0.0
    container_name: vita-message
    restart: always
    ports:
      - "8043:8043"
    environment:
      #      - JAVA_OPTS=-Xms256m -Xmx512m
      - ACTIVE_PROFILE=test
    volumes:
      - /opt/vita/vita-message/logs:/opt/vita/logs/
      - /opt/vita/vita-message/dumps:/opt/vita/dumps/
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"

  vita-im:
    image: xxxxx/vita-im:1.0.0
    container_name: vita-im
    restart: always
    ports:
      - "8043:8043"
    environment:
      #      - JAVA_OPTS=-Xms256m -Xmx512m
      - ACTIVE_PROFILE=test
    volumes:
      - /opt/vita/vita-im/logs:/opt/vita/logs/
      - /opt/vita/vita-im/dumps:/opt/vita/dumps/
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "1"
        compress: "true"