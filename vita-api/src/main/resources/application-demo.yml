server:
  port: 8023
  servlet:
    context-path: /

spring:
  application:
    name: vita-api
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        namespace: vita-dev
        group: dev
  mail:
    # 邮箱发送配置（以下案例为qq邮箱配置）
    host: smtp.qq.com
    port: 587
    # 邮箱账号
    username: xxxxxx@qq.com
    # 授权码（邮箱生成）
    password: xxxxxx

# 日志级别
logging:
  level:
    root: debug
