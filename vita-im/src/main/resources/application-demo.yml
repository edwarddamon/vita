server:
  port: 8053
  servlet:
    context-path: /

spring:
  application:
    name: vita-im
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        namespace: vita-dev
        group: dev
  data:
    redis:
      host: 127.0.0.1
      port: 6399
      password: redis_pwd
      database: 12

# 日志级别
logging:
  level:
    root: debug

# 通用线程池
vita:
  common:
    task-executor:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
      keep-alive-seconds: 300